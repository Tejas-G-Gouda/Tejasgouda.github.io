<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock paper scissor</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    
    <header>
        <div class="heading">
            <h1>Rock paper scissor</h1>
        </div>
    </header>

    <main>
        <div class="choices">
            <div class="choice" id="rock">
                <img src="rock.jpg" alt="rock_img">
            </div>

            <div class="choice" id="paper">
                <img src="paper.jpg" alt="paper_img">
            </div>

            <div class="choice" id="scissor">
                <img src="scissor.jpg" alt="scissor_img">
            </div>
        </div>

        <div class="score-board">
            <div class="your-choice choice-display">
                <img style="display: none;" class="your-rock-choice" src="rock.jpg" alt="rock_img">
                <img style="display: none;" class="your-paper-choice" src="paper.jpg" alt="paper_img">
                <img style="display: none;" class="your-scissor-choice" src="scissor.jpg" alt="scissor_img">
            </div>
            <div class="score">
                <p id="user-score">0</p>
                <p>You</p>
            </div>
            <div class="score">
                <p id="comp-score">0</p>
                <p>comp</p>
            </div>
            <div class="comp-choice choice-display">
                <img style="display: none;" class="comp-rock-choice" src="rock.jpg" alt="rock_img">
                <img style="display: none;" class="comp-paper-choice" src="paper.jpg" alt="paper_img">
                <img style="display: none;" class="comp-scissor-choice" src="scissor.jpg" alt="scissor_img">
            </div>
        </div>

        <div class="msg-container">
            <p id="msg">Play your Move </p>
        </div>
        <div class="msg-container">
            <button class="new_game">New Game</button>
        </div>
    </main>

    <script src="script.js"></script>
</body>

</html>
